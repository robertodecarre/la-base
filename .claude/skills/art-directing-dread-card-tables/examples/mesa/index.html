<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Mesa — muestra</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=VT323&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0908; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; }
      .hud { position: fixed; left: 16px; bottom: 12px; font: 20px/1.25 'VT323', monospace; color: #7fd36b; opacity: .8; pointer-events: none; }
      .hud .help { color: #cfc6a8; opacity: .55; }
      .turn { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); font: 24px 'VT323', monospace; color: #cfc6a8; pointer-events: none; text-shadow: 0 0 6px #000; }
      .dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: #cfc6a8; opacity: 0; pointer-events: none; }
      .stamp { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-6deg) scale(2); opacity: 0; pointer-events: none;
               font: 120px 'IM Fell English SC', serif; color: #d23a2a; letter-spacing: .04em; text-shadow: 4px 4px 0 #1a0303; }
      .stamp.on { animation: stamp 1.6s steps(12) forwards; }
      @keyframes stamp { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-6deg) scale(2) } 12% { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1) }
                         75% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%,-50%) rotate(-6deg) scale(1) } }
    </style>
  </head>
  <body>
    <div class="hud">NOSOTROS ▮▮▮▯ 07 · ELLOS ▮▯▯▯ 03<br /><span class="help">click en carta: jugar · mantené click: mover el brazo y amagar (soltá en el recuadro) · clic der: zoom al cursor (en la mitad lejana de la mesa te parás) · click en la mesa: mirar / soltar la vista · T/E: cantos · M: sonido · A: automático</span></div>
    <div class="turn"></div>
    <div class="dot"></div>
    <div class="stamp"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
