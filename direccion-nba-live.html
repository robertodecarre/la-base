<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Base — estética NBA Live 2001</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow+Semi+Condensed:wght@500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #24306e 0%, #0d1230 55%, #060814 100%);
    padding: 30px 14px;
    font-family: sans-serif;
    overflow: hidden;
  }
  .frame {
    max-width: 420px; margin: 0 auto;
    position: relative;
    border: 2px solid #4a5aa8;
    border-radius: 10px;
    padding: 20px 18px 24px;
    background:
      repeating-linear-gradient(-35deg, rgba(120,140,220,0.05) 0 2px, transparent 2px 90px),
      linear-gradient(180deg, #171f4a 0%, #0a0e26 100%);
    box-shadow: inset 0 0 0 1px #1c245c, 0 0 40px -10px rgba(80,100,220,0.4);
    overflow: hidden;
  }
  .diag {
    position: absolute; top: 0; left: -20%; width: 140%; height: 40px;
    font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic;
    font-size: 13px; letter-spacing: 3px; color: rgba(150,170,255,0.12);
    white-space: nowrap; transform: rotate(-6deg) translateY(4px);
  }

  .badge {
    width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 6px;
    background: radial-gradient(circle at 35% 30%, #7d90e8, #1c2560 70%);
    border: 2px solid #9aa8f0;
    box-shadow: 0 0 14px rgba(120,140,240,0.6), inset 0 0 8px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic;
    font-size: 15px; color: #eef1ff; text-shadow: 0 0 6px #6c7bde;
  }

  .titulo {
    font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic;
    font-size: 13px; letter-spacing: 6px; text-align: center; color: #aab6f2;
    text-shadow: 0 0 8px rgba(140,160,240,0.5);
  }
  .codigo {
    font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic;
    font-size: 34px; letter-spacing: 8px; text-align: center; color: #ffffff;
    text-shadow: 0 0 16px rgba(140,160,255,0.7);
    margin: 4px 0 18px;
  }

  .eq {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: 2px; margin: 0 0 6px 4px;
  }
  .eq.n { color: #6fa3ff; }
  .eq.e { color: #ff7a52; }

  .fila {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    border-radius: 999px;
    padding: 9px 16px;
    margin-bottom: 8px;
    border: 1px solid;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -6px 10px rgba(0,0,0,0.35);
  }
  /* El matiz del óvalo identifica el equipo (azul/naranja) siempre; el
     estado "listo" se expresa con más brillo/glow en ese mismo matiz,
     nunca cambiando de color — el color es del equipo, no del estado. */
  .fila.n {
    background: linear-gradient(180deg, #4a6ac0 0%, #253a80 45%, #16234f 100%);
    border-color: #6f8fe0;
  }
  .fila.n.listo {
    border-color: #8fb0ff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -6px 10px rgba(0,0,0,0.35), 0 0 14px rgba(90,140,255,0.6);
  }
  .fila.e {
    background: linear-gradient(180deg, #d8703f 0%, #8a3c1c 45%, #4f1f0e 100%);
    border-color: #f0966a;
  }
  .fila.e.listo {
    border-color: #ffb385;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -6px 10px rgba(0,0,0,0.35), 0 0 14px rgba(255,140,80,0.6);
  }
  .punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.3); }
  .fila.n.listo .punto { background: #cfe0ff; box-shadow: 0 0 8px #8fb0ff; }
  .fila.e.listo .punto { background: #ffe0cc; box-shadow: 0 0 8px #ffb385; }
  .nombre {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600;
    font-size: 14px; color: #f2f4ff; letter-spacing: 0.5px;
  }

  .cta {
    display: block; text-align: center; margin-top: 16px;
    font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic;
    font-size: 15px; letter-spacing: 3px; color: #fff2ea;
    border-radius: 999px; padding: 13px;
    background: linear-gradient(180deg, #ff8a63 0%, #d8512c 55%, #a02f16 100%);
    border: 1px solid #ffab8a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -6px 10px rgba(0,0,0,0.3), 0 0 18px rgba(255,90,50,0.45);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="diag">LA&nbsp;BASE&nbsp;·&nbsp;LA&nbsp;BASE&nbsp;·&nbsp;LA&nbsp;BASE&nbsp;·&nbsp;LA&nbsp;BASE&nbsp;·&nbsp;LA&nbsp;BASE&nbsp;·&nbsp;LA&nbsp;BASE</div>

    <div class="badge">LB</div>
    <div class="titulo">SALA</div>
    <div class="codigo">TQ7KM</div>

    <div class="eq n">NOSOTROS</div>
    <div class="fila n listo"><span class="punto"></span><span class="nombre">Roberto (vos)</span></div>
    <div class="fila n"><span class="punto"></span><span class="nombre">Tincho</span></div>

    <div class="eq e" style="margin-top:14px">ELLOS</div>
    <div class="fila e listo"><span class="punto"></span><span class="nombre">Vale</span></div>
    <div class="fila e listo"><span class="punto"></span><span class="nombre">Naza</span></div>

    <div class="cta">ESTOY LISTO</div>
  </div>
</body>
</html>
