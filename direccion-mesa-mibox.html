<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Base — mesa corregida (equipos intercalados)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow+Semi+Condensed:wght@500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060814; padding: 20px; }
  svg { display: block; max-width: 560px; margin: 0 auto; }
  text { font-family: 'Barlow Semi Condensed', sans-serif; }
  .display { font-family: 'Saira Condensed', sans-serif; font-weight: 800; font-style: italic; }
</style>
</head>
<body>
<svg viewBox="0 0 600 660">
  <defs>
    <radialGradient id="mesaFondo" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#24306e"/><stop offset="55%" stop-color="#0d1230"/><stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <linearGradient id="panelFondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171f4a"/><stop offset="100%" stop-color="#0a0e26"/>
    </linearGradient>
    <linearGradient id="nosotrosG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6ac0"/><stop offset="45%" stop-color="#253a80"/><stop offset="100%" stop-color="#16234f"/>
    </linearGradient>
    <linearGradient id="ellosG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8703f"/><stop offset="45%" stop-color="#8a3c1c"/><stop offset="100%" stop-color="#4f1f0e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowTurno" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="300" cy="280" rx="280" ry="255" fill="url(#mesaFondo)" stroke="#4a5aa8" stroke-width="2"/>
  <ellipse cx="300" cy="280" rx="150" ry="112" fill="url(#panelFondo)" stroke="#4a5aa8" stroke-width="2"/>

  <!-- texto central: color del EQUIPO de quien la está haciendo (acá Naza, ELLOS) -->
  <text x="300" y="276" text-anchor="middle" fill="rgba(170,182,242,0.55)" font-size="9" letter-spacing="2" class="display">LA ESTÁ HACIENDO</text>
  <text x="300" y="294" text-anchor="middle" fill="#ffb385" font-size="15" class="display" filter="url(#glow)">NAZA</text>

  <!-- ═══ asientos intercalados: E,N,E,N,E,N dando toda la vuelta ═══ -->

  <!-- arriba — VALE, ELLOS -->
  <rect x="244" y="40" width="112" height="96" rx="16" fill="url(#ellosG)" stroke="#f0966a" stroke-width="1.5"/>
  <text x="300" y="62" text-anchor="middle" fill="#ffe6d6" font-size="12" class="display">VALE ★CAP</text>
  <rect x="282.5" y="72" width="35" height="51" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>

  <!-- derecha-arriba — RATA, NOSOTROS, tiene el turno (borde neón, no de equipo) -->
  <g filter="url(#glowTurno)">
    <rect x="440" y="110" width="112" height="96" rx="16" fill="url(#nosotrosG)" stroke="#d4ff00" stroke-width="3"/>
  </g>
  <text x="496" y="132" text-anchor="middle" fill="#dce6ff" font-size="12" class="display">RATA</text>
  <text x="496" y="144" text-anchor="middle" fill="#d4ff00" font-size="7.5" letter-spacing="1" class="display">▶ SU TURNO</text>
  <rect x="478.5" y="150" width="35" height="51" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>

  <!-- derecha-abajo — NAZA, ELLOS, la está haciendo ahora -->
  <rect x="440" y="360" width="112" height="96" rx="16" fill="url(#ellosG)" stroke="#f0966a" stroke-width="1.5"/>
  <text x="496" y="382" text-anchor="middle" fill="#ffe6d6" font-size="12" class="display">NAZA</text>
  <rect x="478.5" y="392" width="35" height="51" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>

  <!-- izquierda-abajo — CACHO, ELLOS -->
  <rect x="60" y="360" width="112" height="96" rx="16" fill="url(#ellosG)" stroke="#f0966a" stroke-width="1.5"/>
  <text x="116" y="382" text-anchor="middle" fill="#ffe6d6" font-size="12" class="display">CACHO</text>
  <rect x="98.5" y="392" width="35" height="51" rx="4" fill="#2a2f55" stroke="#4a5aa8" stroke-width="1"/>

  <!-- izquierda-arriba — PIPA, NOSOTROS -->
  <rect x="60" y="110" width="112" height="96" rx="16" fill="url(#nosotrosG)" stroke="#6f8fe0" stroke-width="1.5"/>
  <text x="116" y="132" text-anchor="middle" fill="#dce6ff" font-size="12" class="display">PIPA</text>
  <rect x="98.5" y="142" width="35" height="51" rx="4" fill="#2a2f55" stroke="#4a5aa8" stroke-width="1"/>

  <!-- abajo — ROBERTO, NOSOTROS, "vos" — caja propia +40%, empujada hacia afuera -->
  <rect x="221.5" y="455.5" width="157" height="137" rx="18" fill="url(#nosotrosG)" stroke="#8fb0ff" stroke-width="2.5"/>
  <text x="300" y="480" text-anchor="middle" fill="#dce6ff" font-size="15" class="display">ROBERTO</text>
  <text x="300" y="494" text-anchor="middle" fill="rgba(220,230,255,0.75)" font-size="9" letter-spacing="1">VOS</text>
  <g>
    <rect x="219.5" y="497" width="43" height="60" rx="5" fill="rgba(143,176,255,0.15)" stroke="#8fb0ff" stroke-width="1.2"/>
    <rect x="222.5" y="500" width="37" height="54" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>
    <rect x="248.5" y="497" width="43" height="60" rx="5" fill="rgba(143,176,255,0.15)" stroke="#8fb0ff" stroke-width="1.2"/>
    <rect x="251.5" y="500" width="37" height="54" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>
    <rect x="277.5" y="497" width="43" height="60" rx="5" fill="rgba(143,176,255,0.15)" stroke="#8fb0ff" stroke-width="1.2"/>
    <rect x="280.5" y="500" width="37" height="54" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>
    <rect x="306.5" y="497" width="43" height="60" rx="5" fill="rgba(143,176,255,0.15)" stroke="#8fb0ff" stroke-width="1.2"/>
    <rect x="309.5" y="500" width="37" height="54" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>
    <rect x="335.5" y="497" width="43" height="60" rx="5" fill="rgba(143,176,255,0.15)" stroke="#8fb0ff" stroke-width="1.2"/>
    <rect x="338.5" y="500" width="37" height="54" rx="4" fill="#f4ecd8" stroke="#8B6914" stroke-width="1"/>
  </g>
</svg>
</body>
</html>
